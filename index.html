<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DeepSleep - 深度睡眠</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background-color: #ffffff; 
        }
        
        /* 侧边栏过渡动画优化：支持宽度变化 + 平滑显示/隐藏，且修复收起后无法展开的问题 */
    .sidebar-transition {
        transition: width 0.2s ease-out, opacity 0.15s ease-out;
        }
        .sidebar-hidden {
            width: 0px !important;
            min-width: 0px !important;
            opacity: 0;
            overflow: hidden;
            border-right-width: 0px !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            margin: 0 !important;
            pointer-events: none;
        }
        /* 侧边栏内部内容在隐藏时也避免点击穿透干扰，但展开时恢复 */
        .sidebar-hidden * {
            pointer-events: none;
        }
        /* 确保展开时内部可交互 */
        #sidebar:not(.sidebar-hidden) * {
            pointer-events: auto;
        }
        
        .input-shadow { box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); transition: box-shadow 0.3s ease; }
        .input-shadow:focus-within { box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); }
        
        .mode-container { position: relative; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 9999px; display: flex; width: 280px; height: 44px; align-items: center; padding: 2px; }
        .mode-slider { position: absolute; top: -2px; left: 0; width: 50%; height: calc(100% + 4px); background-color: #ecefff; border: 1px solid #d1dbff; border-radius: 9999px; box-shadow: 0 2px 8px rgba(77, 107, 254, 0.1); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
        .mode-btn { position: relative; z-index: 2; flex: 1; text-align: center; font-size: 14px; font-weight: 500; transition: color 0.3s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .mode-btn.active { color: #2563eb; }
        .mode-btn.inactive { color: #6b7280; }

        .feature-btn.active { background-color: #ecefff !important; border-color: #d1dbff !important; color: #2563eb !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .three-dots-menu {
            position: fixed;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.02);
            min-width: 140px;
            z-index: 1000;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            backdrop-filter: blur(0px);
        }
        .three-dots-menu-item {
            padding: 8px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.1s;
            color: #374151;
        }
        .three-dots-menu-item:hover {
            background-color: #f3f4f6;
        }
        .three-dots-menu-item.danger {
            color: #dc2626;
        }
        .three-dots-menu-item.danger:hover {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        
        /* 消息气泡样式 - 用户气泡 #EDF3FE 底 + 黑字，机器人直接输出无背景 */
        .message-user {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }
        .message-user .bubble {
            background-color: #EDF3FE;
            padding: 10px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 15px;
            line-height: 1.5;
            color: #1f2937;
            border: 1px solid #dce7fc;
        }
        .message-bot {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }
        .message-bot .bubble {
            background-color: transparent;
            padding: 4px 0;
            border-radius: 0;
            max-width: 100%;
            font-size: 15px;
            line-height: 1.6;
            color: #111827;
            box-shadow: none;
            border: none;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        /* 侧边栏选中样式: 选中时背景 #E4EDFE，文字颜色 #3964FE */
        .chat-item-selected {
            background-color: #E4EDFE !important;
            border-radius: 0.5rem;
        }
        .chat-item-selected .chat-title-text {
            color: #3964FE !important;
            font-weight: 500;
        }
        .chat-item:not(.chat-item-selected):hover {
            background-color: #f3f4f6;
        }
        /* 顶部按钮区域间距优化 */
        .menu-icon-btn {
            cursor: pointer;
            transition: all 0.2s;
        }
        /* 修复textarea滚动条 */
        textarea {
            scrollbar-width: thin;
        }
        /* 保证底部输入框移动端友好 */
        #bottom-input-anchor .input-shadow {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-gray-800 bg-white">

    <aside id="sidebar" class="sidebar-transition w-[260px] min-w-[260px] h-full bg-[#f9f9f9] border-r border-gray-200 flex flex-col flex-shrink-0 relative z-30">
        <div class="px-4 pt-5 pb-3 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="createNewChat()">
                <img src="https://www.deepseek.com/favicon.ico" alt="DeepSeek" class="w-7 h-7">
                <span class="text-[22px] font-semibold tracking-tight text-[#2563eb]">DeepSleep</span>
            </div>
            <!-- 侧边栏折叠按钮 - 完全修复展开/收起逻辑 -->

                </svg>
                开启新对话
            </button>
        </div>
        <div class="flex-1 overflow-y-auto px-2 no-scrollbar" id="chat-history-container"></div>
    </aside>

    <main class="flex-1 flex flex-col h-full relative bg-white z-10">
        <!-- 当侧边栏收起时，增加一个悬浮展开按钮 (解决收起后无法打开的核心改进) -->
        <button id="floatingExpandBtn" onclick="expandSidebarFromFloating()" 
            class="fixed left-3 top-5 z-40 bg-white shadow-md rounded-full p-2 border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all hidden"
            style="display: none;"
            aria-label="展开侧边栏">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

                <line x1="9" y1="3" x2="9" y2="21"></line>

        </button>

                        专家模式

                </div>

                <div id="input-root" class="w-full">
                    <div id="input-area-main" class="w-full bg-white rounded-3xl border border-[#e5e7eb] input-shadow p-4 relative z-20">
                        <textarea id="user-input" rows="1" placeholder="给 DeepSleep 发送消息" class="w-full resize-none outline-none text-[16px] px-2 py-2 max-h-[200px]" oninput="handleInput(this)"></textarea>
                        
                        <div class="flex items-center justify-between mt-3 px-1">
                            <div class="flex gap-2">
                                <button onclick="toggleFeature(this)" class="feature-btn px-3 py-1.5 rounded-full border border-gray-200 flex items-center gap-1.5 text-[13px] text-gray-600 hover:bg-gray-50 transition-all">
                                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.6815 0.963693C10.1169 0.447019 11.6266 0.374829 12.5633 1.31135C13.5 2.24805 13.4277 3.75776 12.911 5.19319C12.7126 5.74431 12.4386 6.31796 12.0965 6.89729C12.4969 7.54638 12.8141 8.19018 13.036 8.80647C13.5527 10.2419 13.6251 11.7516 12.6883 12.6883C11.7516 13.625 10.242 13.5527 8.8065 13.036C8.19022 12.8141 7.54641 12.4969 6.89732 12.0965C6.31797 12.4386 5.74435 12.7125 5.19322 12.911C3.75777 13.4276 2.2481 13.5 1.31138 12.5633C0.374859 11.6266 0.447049 10.1168 0.963724 8.68147C1.17185 8.10338 1.46321 7.50063 1.82896 6.8924C1.52182 6.35711 1.27235 5.82825 1.08872 5.31819C0.572068 3.88278 0.499714 2.37306 1.43638 1.43635C2.37308 0.499655 3.8828 0.572044 5.31822 1.08869C5.82828 1.27232 6.35715 1.5218 6.89243 1.82893C7.50066 1.46318 8.10341 1.17181 8.6815 0.963693ZM11.3573 8.01154C10.9083 8.62253 10.3901 9.22873 9.80943 9.8094C9.22877 10.3901 8.62255 10.9083 8.01158 11.3572C8.4257 11.5841 8.8287 11.7688 9.21275 11.9071C10.5456 12.3868 11.4246 12.2547 11.8397 11.8397C12.2548 11.4246 12.3869 10.5456 11.9071 9.21272C11.7688 8.82866 11.5841 8.42568 11.3573 8.01154ZM2.56529 8.02912C2.37344 8.39322 2.21495 8.74796 2.09263 9.08772C1.61291 10.4204 1.74512 11.2995 2.16001 11.7147C2.57505 12.1297 3.45415 12.2618 4.78697 11.7821C5.11057 11.6656 5.44786 11.5164 5.7938 11.3367C5.249 10.9223 4.70922 10.4533 4.19029 9.9344C3.57578 9.31987 3.03169 8.67633 2.56529 8.02912ZM6.90708 3.2469C6.24065 3.70479 5.5646 4.26321 4.91392 4.91389C4.26325 5.56456 3.70482 6.24063 3.24693 6.90705C3.72674 7.63325 4.32777 8.37459 5.03892 9.08576C5.64943 9.69627 6.28183 10.2265 6.90806 10.6678C7.59368 10.2025 8.2908 9.63076 8.96079 8.96076C9.6308 8.29075 10.2025 7.59366 10.6678 6.90803C10.2265 6.2818 9.69631 5.6494 9.08579 5.03889C8.37462 4.32773 7.63328 3.72672 6.90708 3.2469ZM11.7147 2.15998C11.2996 1.74509 10.4204 1.61288 9.08775 2.0926C8.74835 2.21479 8.39382 2.37271 8.03013 2.56428C8.67728 3                                     深度思考
                                </button>
                                <button onclick="toggleFeature(this)" class="feature-btn px-3 py-1.5 rounded-full border border-gray-200 flex items-center gap-1.5 text-[13px] text-gray-600 hover:bg-gray-50 transition-all">

                                </button>
                                <button id="send-btn" disabled onclick="sendMessage()" class="w-8 h-8 rounded-full bg-[#e5e7eb] flex items-center justify-center text-white cursor-not-allowed transition-all">

        <div id="chat-messages-container" class="hidden flex-1 overflow-y-auto w-full pb-32">
            <div id="chat-messages" class="w-full max-w-[800px] mx-auto px-4 mt-20 space-y-4"></div>
        </div>

        <div id="bottom-input-wrapper" class="hidden absolute bottom-6 w-full flex justify-center px-4 bg-gradient-to-t from-white via-white to-transparent pt-10 z-20">
            <div id="bottom-input-anchor" class="w-full max-w-[800px]"></div>
        </div>
    </main>

    <script>
        let chats = [];
        let currentId = null;
        let activeMenuId = null;
        let isWaitingResponse = false;

        // 关闭所有右键菜单
        function closeAllMenus() {
            const existingMenu = document.querySelector('.three-dots-menu');
            if (existingMenu) existingMenu.remove();
            activeMenuId = null;
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.three-dots-trigger') && !e.target.closest('.three-dots-menu')) {
                closeAllMenus();
            }
        });

        function handleInput(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
            const hasText = el.value.trim().length > 0;
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = !hasText;
            sendBtn.className = `w-8 h-8 rounded-full flex items-center justify-center text-white transition-colors ${hasText ? 'bg-[#2563eb] cursor-pointer' : 'bg-[#e5e7eb] cursor-not-allowed'}`;
        }

        function setMode(mode) {
            const isFast = mode === 'fast';
            document.getElementById('mode-slider').style.transform = isFast ? "translateX(0)" : "translateX(100%)";
            document.getElementById('mode-fast').className = `mode-btn ${isFast ? 'active' : 'inactive'}`;
            document.getElementById('mode-pro').className = `mode-btn ${!isFast ? 'active' : 'inactive'}`;
            document.getElementById('welcome-title').innerText = isFast ? "使用快速模式开始对话" : "使用专家模式开始对话";
        }

        function toggleFeature(btn) { btn.classList.toggle('active'); }
        
        // 核心修复：toggleSidebar 控制收起/展开 + 控制悬浮按钮显示
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const floatingBtn = document.getElementById('floatingExpandBtn');
            const isHidden = sidebar.classList.contains('sidebar-hidden');
            
            if (isHidden) {
                // 展开侧边栏
                sidebar.classList.remove('sidebar-hidden');
                if (floatingBtn) floatingBtn.style.display = 'none';
                // 恢复侧边栏内的指针事件 (通过css已处理)
            } else {
                // 收起侧边栏
                sidebar.classList.add('sidebar-hidden');
                if (floatingBtn) floatingBtn.style.display = 'flex';
            }
            // 确保宽度重置时无残留样式
            if (!sidebar.classList.contains('sidebar-hidden')) {
                sidebar.style.width = '';
                sidebar.style.minWidth = '';
            }
        }
        
        // 悬浮按钮展开侧边栏（同时隐藏自身）
        function expandSidebarFromFloating() {
            const sidebar = document.getElementById('sidebar');
            const floatingBtn = document.getElementById('floatingExpandBtn');
            if (sidebar.classList.contains('sidebar-hidden')) {
                sidebar.classList.remove('sidebar-hidden');
            }
            if (floatingBtn) floatingBtn.style.display = 'none';
            // 重置侧边栏样式
            sidebar.style.width = '';
            sidebar.style.minWidth = '';
        }

        // 监听侧边栏折叠状态，在窗口resize时若侧边栏隐藏但窗口变宽，可自适应，同时悬浮按钮状态同步
        function syncFloatingButton() {
            const sidebar = document.getElementById('sidebar');
            const floatingBtn = document.getElementById('floatingExpandBtn');
            if (sidebar && floatingBtn) {
                if (sidebar.classList.contains('sidebar-hidden')) {
                    floatingBtn.style.display = 'flex';
                } else {
                    floatingBtn.style.display = 'none';
                }
            }
        }
        window.addEventListener('resize', syncFloatingButton);

        function renameChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;
            const newTitle = prompt('请输入新的对话名称', chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim().slice(0, 20);
                renderHistory();
            }
            closeAllMenus();
        }

        function togglePinChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                chat.pinned = !chat.pinned;
                renderHistory();
            }
            closeAllMenus();
        }

        function shareChat(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                const shareText = `DeepSeep 对话分享: ${chat.title} (共 ${chat.messages.length} 条消息)`;
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('对话信息已复制到剪贴板，可分享给好友！');
                }).catch(() => {
                    alert('分享内容: ' + shareText);
                });
            }
            closeAllMenus();
        }

        function deleteChat(chatId) {
            chats = chats.filter(c => c.id !== chatId);
            if (currentId === chatId) createNewChat();
            renderHistory();
            closeAllMenus();
        }

        function showChatMenu(event, chatId) {
            event.stopPropagation();
            closeAllMenus();
            const triggerBtn = event.currentTarget;
            const rect = triggerBtn.getBoundingClientRect();
            const menuDiv = document.createElement('div');
            menuDiv.className = 'three-dots-menu';
            let left = rect.right - 140;
            let top = rect.bottom + 4;
            if (left + 140 > window.innerWidth) left = rect.right - 140;
            if (left < 0) left = rect.left;
            if (top + 200 > window.innerHeight) top = rect.top - 200;
            if (top < 0) top = 4;
            menuDiv.style.left = `${left}px`;
            menuDiv.style.top = `${top}px`;
            const chatData = chats.find(c => c.id === chatId);
            const pinText = chatData && chatData.pinned ? '取消置顶' : '置顶';
            menuDiv.innerHTML = `
                <div class="three-dots-menu-item" data-action="rename">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 4-7 7H10v-4l7-7z"/><path d="M4 20h16"/></svg>
                    重命名
                </div>
                <div class="three-dots-menu-item" data-action="pin">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="9"/><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 1-14 0"/></svg>
                    ${pinText}
                </div>
                <div class="three-dots-menu-item" data-action="share">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    分享
                </div>
                <div class="three-dots-menu-item danger" data-action="delete">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    删除
                </div>
            `;
            document.body.appendChild(menuDiv);
            activeMenuId = chatId;
            menuDiv.querySelector('[data-action="rename"]').addEventListener('click', (e) => { e.stopPropagation(); renameChat(chatId); });
            menuDiv.querySelector('[data-action="pin"]').addEventListener('click', (e) => { e.stopPropagation(); togglePinChat(chatId); });
            menuDiv.querySelector('[data-action="share"]').addEventListener('click', (e) => { e.stopPropagation(); shareChat(chatId); });
            menuDiv.querySelector('[data-action="delete"]').addEventListener('click', (e) => { e.stopPropagation(); deleteChat(chatId); });
            menuDiv.addEventListener('click', (e) => e.stopPropagation());
        }

        function addBotReply(chatId, replyText) {
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                chat.messages.push({ role: 'bot', content: replyText });
                if (currentId === chatId) renderMessages();
                renderHistory();
            }
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text || isWaitingResponse) return;
            if (currentId === null) {
                currentId = Date.now();
                chats.push({ id: currentId, title: text.slice(0, 12), messages: [], pinned: false });
            }
            const activeChat = chats.find(c => c.id === currentId);
            activeChat.messages.push({ role: 'user', content: text });
            document.getElementById('center-container').classList.add('hidden');
            document.getElementById('chat-messages-container').classList.remove('hidden');
            document.getElementById('bottom-input-wrapper').classList.remove('hidden');
            const inputArea = document.getElementById('input-area-main');
            const bottomAnchor = document.getElementById('bottom-input-anchor');
            if (inputArea && bottomAnchor && !bottomAnchor.contains(inputArea)) bottomAnchor.appendChild(inputArea);
            input.value = '';
            handleInput(input);
            renderMessages();
            renderHistory();
            isWaitingResponse = true;
            setTimeout(() => {
                addBotReply(currentId, `哈哈，被你发现了（并没有）！😏\n\n你成功召唤的不是DeepSeek，而是**DeepSleep深度睡眠** 一个擅长打盹、偶尔胡言乱语的冒牌货～\n\n真正的聪明蛋在隔壁 👉 https://deepseek.com`);
                isWaitingResponse = false;
                const scrollArea = document.getElementById('chat-messages-container');
                if (scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
            }, 500);
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            const activeChat = chats.find(c => c.id === currentId);
            if (!activeChat) return;
            container.innerHTML = activeChat.messages.map(m => {
                if (m.role === 'user') return `<div class="message-user"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
                else return `<div class="message-bot"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
            }).join('');
            const scrollArea = document.getElementById('chat-messages-container');
            if (scrollArea) scrollArea.scrollTo({ top: scrollArea.scrollHeight, behavior: 'smooth' });
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/\n/g, '<br>');
        }

        function renderHistory() {
            const container = document.getElementById('chat-history-container');
            const sortedChats = [...chats].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return b.id - a.id;
            });
            container.innerHTML = sortedChats.map(chat => {
                const isSelected = (chat.id === currentId);
                const selectedClass = isSelected ? 'chat-item-selected' : '';
                return `
                    <div class="chat-item group flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-[#f0f2f5] cursor-pointer mb-1 transition-all ${selectedClass}" data-chat-id="${chat.id}">
                        <div class="flex items-center gap-1 flex-1 min-w-0" onclick="switchChat(${chat.id})">
                            ${chat.pinned ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3964FE" stroke-width="2" class="flex-shrink-0"><line x1="12" y1="3" x2="12" y2="9"/><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 1-14 0"/></svg>` : ''}
                            <span class="chat-title-text text-sm truncate flex-1 ${isSelected ? 'text-[#3964FE] font-medium' : 'text-gray-700'}">${escapeHtml(chat.title)}</span>
                        </div>
                        <button class="three-dots-trigger opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-gray-600 transition-opacity" onclick="showChatMenu(event, ${chat.id})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function switchChat(id) {
            closeAllMenus();
            currentId = id;
            document.getElementById('center-container').classList.add('hidden');
            document.getElementById('chat-messages-container').classList.remove('hidden');
            document.getElementById('bottom-input-wrapper').classList.remove('hidden');
            const inputArea = document.getElementById('input-area-main');
            const bottomAnchor = document.getElementById('bottom-input-anchor');
            if (inputArea && bottomAnchor && !bottomAnchor.contains(inputArea)) bottomAnchor.appendChild(inputArea);
            renderMessages();
            renderHistory();
        }

        function createNewChat() {
            closeAllMenus();
            currentId = null;
            document.getElementById('center-container').classList.remove('hidden');
            document.getElementById('chat-messages-container').classList.add('hidden');
            document.getElementById('bottom-input-wrapper').classList.add('hidden');
            const inputArea = document.getElementById('input-area-main');
            const inputRoot = document.getElementById('input-root');
            if (inputArea && inputRoot && !inputRoot.contains(inputArea)) inputRoot.appendChild(inputArea);
            document.getElementById('chat-messages').innerHTML = '';
            renderHistory();
            const inputEl = document.getElementById('user-input');
            if (inputEl) inputEl.value = '';
            handleInput(inputEl);
            isWaitingResponse = false;
        }

        // 挂载全局
        window.showChatMenu = showChatMenu;
        window.renameChat = renameChat;
        window.togglePinChat = togglePinChat;
        window.shareChat = shareChat;
        window.deleteChat = deleteChat;
        window.sendMessage = sendMessage;
        window.switchChat = switchChat;
        window.createNewChat = createNewChat;
        window.setMode = setMode;
        window.toggleFeature = toggleFeature;
        window.toggleSidebar = toggleSidebar;
        window.handleInput = handleInput;
        window.expandSidebarFromFloating = expandSidebarFromFloating;

        renderHistory();
        syncFloatingButton();
    </script>
</body>
</html>
